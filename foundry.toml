[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./erc8004" }]

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 120
